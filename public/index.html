<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    input { padding: .5rem; flex: 1 1 150px; }
    button { padding: .5rem 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ccc; padding: .5rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Student Management</h1>
  <form id="form">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="course" placeholder="Course" required>
    <button type="submit">Add</button>
  </form>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const rows = document.getElementById('rows');
    async function load() {
      const list = await (await fetch('/students')).json();
      rows.innerHTML = '';
      list.forEach((s) => {
        const tr = document.createElement('tr');
        [s.id, s.name, s.email, s.course].forEach((v) => {
          const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        const td = document.createElement('td');
        const b = document.createElement('button'); b.textContent = 'Delete';
        b.onclick = async () => { await fetch('/students/' + s.id, { method: 'DELETE' }); load(); };
        td.appendChild(b); tr.appendChild(td); rows.appendChild(tr);
      });
    }
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        course: document.getElementById('course').value
      };
      await fetch('/students', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      e.target.reset(); load();
    });
    load();
  </script>
</body>
</html>
